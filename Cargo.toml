[workspace]
members = [
    "sbql-core",
    "sbql-tui",
    "sbql-ffi",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
authors = ["sbql contributors"]
license = "MIT"

# Keeping panics out of a full-screen terminal app, mechanically.
#
# A panic here is not a stack trace on stderr: it is a garbled shell. The panic
# hook in `sbql-tui::tui` restores the terminal first, but that is damage
# control — these lints are what stop the panic being written in the first
# place. Warn rather than deny so a work-in-progress still builds; CI is where
# they are meant to bite. Test code is exempted in `clippy.toml`.
#
# Not enabled: `indexing_slicing`. `x[i]` panics as readily as `unwrap` and
# reads as though it cannot, but the diagram canvas indexes heavily and would
# have to be reworked first.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[workspace.dependencies]
# Local workspace crate.
# `default-features = false` has to live here: Cargo ignores a member's
# `default-features = false` when the dependency is inherited from the
# workspace, so members opt back in via their own `keyring` feature.
sbql-core = { path = "sbql-core", version = "0.3.1", default-features = false }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "mysql", "uuid", "chrono", "json", "bigdecimal"] }
redis = { version = "0.27", features = ["tokio-comp", "aio", "connection-manager"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
mongodb = "3"

# SQL parsing
sqlparser = "0.53"

# Config serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Credential storage
# Platform backends are selected per-target in sbql-core/Cargo.toml, because
# enabling a backend feature for the wrong OS silently falls back to keyring's
# in-memory mock store (passwords would not survive a restart).
keyring = "3"

# Identifiers
# v5 as well as v4: discovered Docker connections derive their id from the
# container id so a re-scan re-identifies the same container.
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = { version = "0.7", features = ["crossterm"] }

# Ordered map (used by diagram data loader)
indexmap = "2"

# Tree-sitter (syntax highlighting)
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-sequel = "0.3"

# SQL Server (tiberius + bb8 connection pooling)
tiberius = { version = "0.12", default-features = false, features = ["chrono", "rustls"] }
bb8 = "0.8"
bb8-tiberius = "0.15"
tokio-util = { version = "0.7", features = ["compat"] }

# CSV parsing
csv = "1"

# SSH tunneling
russh = "0.48"
russh-keys = "0.48"
async-trait = "0.1"

# Benchmarking & profiling
criterion = { version = "0.5", features = ["async_tokio"] }
dhat = "0.3"
