[workspace]
members = [
    "sbql-core",
    "sbql-tui",
    "sbql-ffi",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
authors = ["sbql contributors"]
license = "MIT"
# Not a preference — this is the floor the dependency graph already imposes.
# `cargo metadata` reports 1.91.1 as the highest `rust-version` among resolved
# dependencies (the aws-smithy crates behind aws-sdk-dynamodb). Declaring it
# means a too-old toolchain fails with "requires rustc 1.91" instead of a wall
# of errors from inside someone else's crate.
rust-version = "1.91"

# Keeping panics out of a full-screen terminal app, mechanically.
#
# A panic here is not a stack trace on stderr: it is a garbled shell. The panic
# hook in `sbql-tui::tui` restores the terminal first, but that is damage
# control — these lints are what stop the panic being written in the first
# place. Warn rather than deny so a work-in-progress still builds; CI is where
# they are meant to bite. Test code is exempted in `clippy.toml`.
#
# Not enabled: `indexing_slicing`. `x[i]` panics as readily as `unwrap` and
# reads as though it cannot, but the diagram canvas indexes heavily and would
# have to be reworked first.
#
# The rest of the lint policy, and the lints deliberately *not* adopted, are
# documented in CODE_STYLE.md.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Printing and the alternate screen.
#
# This is a correctness lint here, not a tidiness one. While the TUI holds the
# alternate screen the terminal is ours; anything written to stdout lands in
# the middle of the render and stays there until a full redraw. `main.rs` is
# the one place allowed to print, because it runs before the screen is taken
# and after it is given back — it opts out locally.
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"

# Cost. Each of these has a strictly cheaper spelling with identical meaning:
# `clone_from` reuses the destination's allocation, `write!` skips a throwaway
# `String` per push, and inline captures skip the argument-order mistake.
assigning_clones = "warn"
format_push_string = "warn"
implicit_clone = "warn"
redundant_clone = "warn"
uninlined_format_args = "warn"

# Readability. Same set as jj and ratatui use; none of these change behaviour.
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
single_char_pattern = "warn"
unnested_or_patterns = "warn"
use_self = "warn"

[workspace.lints.rust]
# There is currently no `unsafe` anywhere in the workspace, so this costs
# nothing today and only gets more expensive to adopt later. `warn` rather than
# `forbid` at the workspace level because sbql-ffi cannot honour it: uniffi's
# proc macros expand to `unsafe` code. That crate opts out at its crate root,
# with a comment, so the exemption is visible rather than global.
unsafe_code = "warn"
# `pub` should mean "part of this crate's contract". Anything reachable only
# from inside is `pub(crate)`, which is what the compiler can then rely on.
unreachable_pub = "warn"
# `let _ = guard;` drops immediately, which for a lock or a tempdir is almost
# never what was meant.
let_underscore_drop = "warn"

[workspace.lints.rustdoc]
# The docs lean heavily on intra-doc links (`[`CoreEvent::Error`]`). A link
# that stops resolving after a rename is a silently broken doc, so it fails the
# build rather than warning.
broken_intra_doc_links = "deny"

[workspace.dependencies]
# Local workspace crate.
# `default-features = false` has to live here: Cargo ignores a member's
# `default-features = false` when the dependency is inherited from the
# workspace, so members opt back in via their own `keyring` feature.
sbql-core = { path = "sbql-core", version = "0.3.1", default-features = false }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "mysql", "uuid", "chrono", "json", "bigdecimal"] }
redis = { version = "0.27", features = ["tokio-comp", "aio", "connection-manager"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
mongodb = "3"

# SQL parsing
sqlparser = "0.53"

# Config serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Credential storage
# Platform backends are selected per-target in sbql-core/Cargo.toml, because
# enabling a backend feature for the wrong OS silently falls back to keyring's
# in-memory mock store (passwords would not survive a restart).
keyring = "3"

# Identifiers
# v5 as well as v4: discovered Docker connections derive their id from the
# container id so a re-scan re-identifies the same container.
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = { version = "0.7", features = ["crossterm"] }

# Ordered map (used by diagram data loader)
indexmap = "2"

# Tree-sitter (syntax highlighting)
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-sequel = "0.3"

# SQL Server (tiberius + bb8 connection pooling)
tiberius = { version = "0.12", default-features = false, features = ["chrono", "rustls"] }
bb8 = "0.8"
bb8-tiberius = "0.15"
tokio-util = { version = "0.7", features = ["compat"] }

# CSV parsing
csv = "1"

# SSH tunneling
russh = "0.48"
russh-keys = "0.48"
async-trait = "0.1"

# Benchmarking & profiling
criterion = { version = "0.5", features = ["async_tokio"] }
dhat = "0.3"

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------

# `release-binaries.yml` ships this profile to users, and until now it was
# cargo's bare default. Thin LTO plus a single codegen unit is the conservative
# pairing (what helix ships); `fat` LTO buys little here and costs minutes of
# CI on every tag.
#
# Not set: `panic = "abort"`. The panic hook in `sbql-tui::tui` that restores
# the terminal does still run under abort, but unwinding is what lets a panic
# in one worker task avoid taking the process — and a garbled terminal is
# exactly the outcome we are trying to avoid.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Benchmarks are only comparable against themselves if codegen is stable
# between runs.
[profile.bench]
lto = "thin"
codegen-units = 1

# `make flamegraph` and `make profile-memory` need symbols, which `release`
# strips. Inheriting from `release` keeps the optimisation decisions identical,
# so what is profiled is what ships.
[profile.profiling]
inherits = "release"
strip = false
debug = "full"
lto = false
