[package]
name = "sbql-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "UniFFI bridge for sbql-core (macOS/iOS)"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]
name = "sbql_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# The FFI is the macOS/iOS bridge, where the Keychain is always present, so
# the credential store is a hard requirement — not an optional feature. Making
# it non-optional means a `--no-default-features` build cannot silently produce
# an FFI that keeps passwords in memory only while `save_connection` still
# reports success. `features = ["keyring"]` enables it on top of the
# workspace-inherited `default-features = false`.
#
# The dependency is inherited (`workspace = true`) rather than a bare `path`
# for consistency with sbql-tui and so the version is managed in one place.
# release-plz does not package this crate (`release = false` in
# release-plz.toml), so the version requirement is no longer load-bearing for
# releases — it is simply the workspace default.
sbql-core = { workspace = true, features = ["keyring"] }
uniffi = { version = "0.29", features = ["tokio", "cli"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
# Diagnostics have nowhere else to go. Printing from here is worse than
# useless: the crate is linked into a SwiftUI app, so stderr lands in a Console
# log no user opens, and the failure reads as silence. `tracing` at least gives
# the host something it can subscribe to — which the macOS app does not do yet,
# so a warning emitted here is still dropped until it installs a subscriber.
tracing.workspace = true

[dev-dependencies]
# Tests build a real `SbqlEngine`, which persists connections. Without a temp
# config dir to point them at, they write the developer's real
# `~/.config/sbql/connections.toml`.
tempfile = "3"

[lints]
workspace = true
