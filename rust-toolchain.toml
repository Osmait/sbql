# Contributors get `rustfmt` and `clippy` without being told to install them —
# which matters now that CI rejects a PR for either one.
#
# `stable` rather than a pinned version: a pin is only honest if somebody bumps
# it, and nobody does. The floor that actually needs stating is the MSRV, and
# that lives in `Cargo.toml` (`rust-version`), checked by cargo itself.
#
# The cost is that a new clippy release can introduce a lint that fails CI on an
# untouched branch. That is a known, visible failure with a one-line fix, and it
# is cheaper than the alternative: silently building on a toolchain nobody has
# looked at in a year.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
