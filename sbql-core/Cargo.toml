[package]
name = "sbql-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core engine for sbql"
repository = "https://github.com/Osmait/sbql"

[dependencies]
tokio.workspace = true
sqlx.workspace = true
sqlparser.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
keyring = { workspace = true, optional = true }
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
csv.workspace = true
dirs = "5"
futures = "0.3"
indexmap.workspace = true
redis.workspace = true
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
mongodb.workspace = true
tiberius.workspace = true
bb8.workspace = true
bb8-tiberius.workspace = true
tokio-util.workspace = true
russh.workspace = true
russh-keys.workspace = true
async-trait.workspace = true

# --- Platform credential stores ---------------------------------------------
# `keyring` picks its backend from the enabled features. If none matches the
# target OS it silently uses an in-process mock store, so each supported OS
# needs its own feature here.

# macOS: native Keychain via security-framework.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, optional = true, features = ["apple-native"] }

# Linux / BSD: Secret Service over D-Bus (gnome-keyring, KWallet, KeePassXC...).
# `sync-secret-service` is the blocking client, which is what we need since the
# keyring calls happen inside a Tokio runtime and the async backend deadlocks
# there. `crypto-rust` keeps the session encryption pure Rust (no OpenSSL).
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { workspace = true, optional = true, features = [
    "sync-secret-service",
    "crypto-rust",
] }

[features]
default = ["keyring"]

# Persist passwords in the OS credential store. Turning this off drops the
# dependency entirely — no libdbus needed on Linux — and passwords then live
# only in memory for the duration of a session.
keyring = ["dep:keyring"]

dhat-heap = ["dep:dhat"]
# Build libdbus from source instead of linking the system one. Useful for
# self-contained Linux builds where libdbus-1-dev is not installed.
vendored-dbus = ["keyring/vendored"]

[dependencies.dhat]
workspace = true
optional = true

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "redis", "mysql", "mssql_server"] }
tempfile = "3"
criterion = { workspace = true }

[[bench]]
name = "query_builder"
harness = false

[[bench]]
name = "query_execution"
harness = false

[[bench]]
name = "postgres_integration"
harness = false

[[bench]]
name = "redis_integration"
harness = false
