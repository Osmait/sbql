name: PR Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # CONTRIBUTING.md has claimed a zero-warnings policy since the repo existed,
  # and until this job nothing enforced it. Separate from `test` so a formatting
  # slip reports as a formatting slip, and so it fails in seconds instead of
  # after the container-backed suites.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        # keyring links the Secret Service client against libdbus on Linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      # `--all-targets` here but not in `test`: clippy only *builds* the
      # benchmarks, it does not run them, so the teardown panic that forces the
      # test job to be selective does not apply.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The keyring-free build is a supported configuration, and its cfg-gated
      # branches are invisible to the run above.
      - name: cargo clippy (no keyring)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      # `broken_intra_doc_links` is `deny` in Cargo.toml, but only rustdoc ever
      # evaluates it — a clippy run will not catch a link broken by a rename.
      - name: cargo doc
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        # keyring links the Secret Service client against libdbus on Linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # Not `--all-targets`: that also *runs* the benchmarks, and the
      # container-backed ones drop their testcontainers guard after the Tokio
      # runtime is gone, so teardown panics ("there is no reactor running")
      # and fails the job even though every benchmark passed. Marking the
      # `[[bench]]` targets `test = false` does not help — `--all-targets`
      # selects benches regardless of it.
      - name: Run workspace tests
        run: cargo test --workspace --lib --bins --tests

      # Benches and examples are no longer built by the step above, so compile
      # them here. Otherwise they rot unnoticed until someone runs them.
      - name: Check benches and examples still build
        run: cargo check --workspace --all-targets

      # The keyring is optional; without this the no-keyring path silently rots.
      # Only the feature-gated tests run here — the container suites above
      # already cover the database code and are too slow to repeat.
      - name: Build and test without the keyring feature
        run: |
          cargo test -p sbql-core --no-default-features --lib
          cargo test -p sbql-core --no-default-features \
            --test keyring_integration --test sqlite_workflow
          cargo test -p sbql-tui --no-default-features
          cargo build -p sbql-tui --no-default-features
