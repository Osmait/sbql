name: PR Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Supply-chain audit: RustSec advisories, licence compatibility, banned and
  # duplicated crates, and where the sources come from. Config and the reason
  # behind every exception live in `deny.toml`; `make audit` runs the same
  # thing locally.
  #
  # Deliberately none of the setup the `test` job needs: cargo-deny resolves
  # the graph from Cargo.lock and never invokes rustc, so there is nothing to
  # link against (no libdbus for keyring) and nothing to cache (no
  # Swatinem/rust-cache). The action ships a prebuilt binary, so this job
  # finishes in seconds while `test` is still compiling.
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # All four checks, so a new dependency cannot slip past by only
          # being clean on advisories.
          command: check advisories licenses bans sources

  test:
    name: cargo test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        # keyring links the Secret Service client against libdbus on Linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # Not `--all-targets`: that also *runs* the benchmarks, and the
      # container-backed ones drop their testcontainers guard after the Tokio
      # runtime is gone, so teardown panics ("there is no reactor running")
      # and fails the job even though every benchmark passed. Marking the
      # `[[bench]]` targets `test = false` does not help — `--all-targets`
      # selects benches regardless of it.
      - name: Run workspace tests
        run: cargo test --workspace --lib --bins --tests

      # Benches and examples are no longer built by the step above, so compile
      # them here. Otherwise they rot unnoticed until someone runs them.
      - name: Check benches and examples still build
        run: cargo check --workspace --all-targets

      # The keyring is optional; without this the no-keyring path silently rots.
      # Only the feature-gated tests run here — the container suites above
      # already cover the database code and are too slow to repeat.
      - name: Build and test without the keyring feature
        run: |
          cargo test -p sbql-core --no-default-features --lib
          cargo test -p sbql-core --no-default-features \
            --test keyring_integration --test sqlite_workflow
          cargo test -p sbql-tui --no-default-features
          cargo build -p sbql-tui --no-default-features
