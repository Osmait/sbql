[package]
name = "sbql-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Terminal UI for sbql"
repository = "https://github.com/Osmait/sbql"
publish = false

[[bin]]
name = "sbql"
path = "src/main.rs"

[features]
default = ["keyring"]

# Persist passwords in the OS credential store. Build with
# `--no-default-features` for a keyring-free binary: passwords are then kept in
# memory for the session only, and on Linux the libdbus build dependency goes
# away entirely.
keyring = ["sbql-core/keyring"]

[dependencies]
sbql-core = { workspace = true, default-features = false }
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
uuid.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ratatui.workspace = true
crossterm.workspace = true
tui-textarea.workspace = true
tree-sitter.workspace = true
tree-sitter-highlight.workspace = true
tree-sitter-sequel.workspace = true

[dev-dependencies]
tempfile = "3"
